<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Dapur Kilat Nusantara — game masak masakan jalanan Indonesia: terima pesanan, masak di wajan, sajikan tepat waktu.">
<title>Dapur Kilat Nusantara — Game Masak</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b1d16;
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 1280 / 720;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #ffe0b2;
    cursor: pointer;
  }
</style>
</head>
<body>
  <noscript>Game ini butuh JavaScript. Nyalakan JavaScript di browser lalu muat ulang.</noscript>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
